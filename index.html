<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card" aria-label="待辦清單">
        <header class="header">
          <h1>待辦清單</h1>
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="切換深色模式"
          >
            <span class="toggle-icon">🌙</span>
            <span class="toggle-text">深色模式</span>
          </button>
        </header>

        <form id="todo-form" class="todo-form" novalidate>
          <input
            id="todo-input"
            type="text"
            placeholder="新增待辦事項"
            aria-label="新增待辦事項"
            maxlength="120"
          />
          <button type="submit">新增</button>
        </form>

        <div class="filter-group" aria-label="待辦篩選">
          <button class="filter-btn active" data-filter="all" type="button">全部</button>
          <button class="filter-btn" data-filter="pending" type="button">未完成</button>
          <button class="filter-btn" data-filter="completed" type="button">已完成</button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
        <p id="empty-state" class="empty-state" hidden>還沒有任何待辦事項,新增一個吧!</p>

        <footer class="todo-footer">
          <div class="todo-actions">
            <span id="todo-count">未完成: 0 項</span>
            <button
              id="clear-completed"
              class="clear-completed-btn"
              type="button"
              aria-label="清除所有已完成事項"
              hidden
            >
              清除已完成
            </button>
          </div>
        </footer>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
